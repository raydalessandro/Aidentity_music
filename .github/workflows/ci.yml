name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: typecheck, lint, test, build
        run: npm run check

  db:
    name: Database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Avvia lo stack locale Supabase
        run: npx supabase start -x realtime,imgproxy,studio,edge-runtime,logflare,vector

      # Il test vero: lo schema deve ricostruirsi dal nulla, ogni volta.
      - name: Ricostruzione da zero (migrazioni + seed)
        run: npx supabase db reset

      - name: Lint dello schema
        run: npx supabase db lint --fail-on error

      - name: Test pgTAP (RLS, quote, moderazione)
        run: npx supabase test db

      - name: Nessuna deriva fra schema e migrazioni
        run: |
          npx supabase db diff --schema public > /tmp/diff.sql
          if [ -s /tmp/diff.sql ]; then
            echo "::error::Lo schema applicato non corrisponde alle migrazioni."
            cat /tmp/diff.sql
            exit 1
          fi

  e2e:
    name: E2E e accessibilità
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Guardia: il job resta un no-op finché il filone D non introduce i test.
      # Deve esistere fin da ora, perché gli agenti non possono modificare
      # i workflow: si accende da solo quando compare la cartella e2e/.
      - name: Verifica presenza dei test E2E
        id: guardia
        run: |
          if [ -d e2e ] && [ -n "$(ls -A e2e 2>/dev/null)" ]; then
            echo "presenti=true" >> "$GITHUB_OUTPUT"
            echo "Test E2E trovati: eseguo la suite."
          else
            echo "presenti=false" >> "$GITHUB_OUTPUT"
            echo "Nessun test E2E ancora presente: job superato senza eseguire nulla."
          fi

      - uses: actions/setup-node@v4
        if: steps.guardia.outputs.presenti == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Installa le dipendenze
        if: steps.guardia.outputs.presenti == 'true'
        run: npm ci

      - name: Installa Chromium
        if: steps.guardia.outputs.presenti == 'true'
        run: npx playwright install --with-deps chromium

      # Senza database, un test che legge da Postgres non può girare qui: e uno
      # che "passa" senza database non sta verificando niente. `supabase start`
      # applica già migrazioni e seed su un runner vergine, quindi NON si ripete
      # il `db reset` del job Database — là la ricostruzione da zero è il test,
      # qui servirebbe solo come mezzo. Niente lint, niente pgTAP, niente diff.
      - name: Avvia lo stack locale Supabase
        if: steps.guardia.outputs.presenti == 'true'
        run: npx supabase start -x realtime,imgproxy,studio,edge-runtime,logflare,vector

      # Chiavi dello stack locale ed effimero, generate dalla CLI a ogni run e
      # valide solo dentro questo runner: non sono segreti, non vanno in un
      # secret di repository e non passano dal diff.
      #
      # `SERVICE_ROLE_KEY` serve alla route media (`/api/media/...`): senza, la
      # route risponde 500 «media non configurato» su ogni caso — positivo e
      # negativo — e i test passerebbero per il motivo sbagliato. Vale la stessa
      # natura effimera delle altre due: si spegne con il runner. Resta vero
      # L0.7 §6.9 — `service_role` non compare nel client, nel repository e nei
      # log: qui vive solo nell'ambiente del processo server di Next.
      #
      # Lo step fallisce SUBITO se una delle tre è vuota, e stampa i soli NOMI delle
      # chiavi che `supabase status` restituisce davvero. Mai i valori. Senza questa
      # verifica un campo rinominato a monte non si manifesta qui: si manifesta molto
      # più tardi come un 500 dentro un test, cioè come un errore muto da indovinare.
      # `jq -r 'keys[]'` stampa nomi, non valori: è l'unica cosa che si può mostrare.
      - name: Esporta le credenziali locali per Next
        if: steps.guardia.outputs.presenti == 'true'
        run: |
          set -euo pipefail
          STATUS=$(npx supabase status -o json)

          API_URL=$(echo "$STATUS" | jq -r '.API_URL // empty')
          ANON_KEY=$(echo "$STATUS" | jq -r '.ANON_KEY // empty')
          SERVICE_ROLE_KEY=$(echo "$STATUS" | jq -r '.SERVICE_ROLE_KEY // empty')

          MANCANTI=""
          [ -n "$API_URL" ] || MANCANTI="$MANCANTI API_URL"
          [ -n "$ANON_KEY" ] || MANCANTI="$MANCANTI ANON_KEY"
          [ -n "$SERVICE_ROLE_KEY" ] || MANCANTI="$MANCANTI SERVICE_ROLE_KEY"

          echo "Campi esposti da 'supabase status -o json' (soli nomi):"
          echo "$STATUS" | jq -r 'keys[]' | sed 's/^/  · /'

          if [ -n "$MANCANTI" ]; then
            echo "::error::supabase status non espone:$MANCANTI — vedi l'elenco dei nomi qui sopra."
            exit 1
          fi

          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Playwright + axe
        if: steps.guardia.outputs.presenti == 'true'
        run: npm run test:e2e

  secrets:
    name: Segreti
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scansione del diff
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-list --max-parents=0 HEAD | tail -1)
          fi
          if git diff --no-color "$BASE"...HEAD | grep -nE 'sk_live_|rk_live_|whsec_|eyJhbGciOi'; then
            echo "::error::Possibile chiave o token nel diff."
            exit 1
          fi
          echo "Pulito."
